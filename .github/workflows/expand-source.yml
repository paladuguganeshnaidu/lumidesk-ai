name: Expand LumiDesk source into repository

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  expand-source:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Reconstruct project files
        shell: bash
        run: |
          set -euo pipefail
          cat lumidesk_source.part01.b64 lumidesk_source.part02.b64 lumidesk_source.part03.b64 lumidesk_source.part04.b64 lumidesk_source.part05a.b64 lumidesk_source.part05b.b64 lumidesk_source.part05c.b64 lumidesk_source.part05d.b64 | tr -d '\n' | base64 -d > /tmp/lumidesk_source.zip
          unzip -oq /tmp/lumidesk_source.zip -d .
          cat > build.sh <<'EOF'
          #!/usr/bin/env bash
          set -euo pipefail
          pip install --no-cache-dir -r requirements.txt
          EOF
          chmod +x build.sh
          rm -f lumidesk_source.part*.b64
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Expand LumiDesk application source"
          git push
