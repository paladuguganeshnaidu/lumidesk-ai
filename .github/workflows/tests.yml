name: Test LumiDesk AI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest pytest-asyncio
      - name: Validate browser JavaScript syntax
        run: |
          node --check app/static/app.js
          node --check app/static/portal.js
      - name: Run tests
        run: python -m pytest -q
      - name: Install Chromium for UI tests
        run: |
          python -m pip install playwright
          python -m playwright install --with-deps chromium
      - name: Browser E2E smoke test
        run: |
          python tests/browser_smoke_v5.py
          python tests/browser_image_editor_v7.py
